# RunDeck Project Properties — synthetic-monitoring
# Place this at: $RUNDECK_BASE/projects/synthetic-monitoring/etc/project.properties

project.name=synthetic-monitoring
project.label=Playwright Synthetic Monitor
project.description=Unattended synthetic monitoring for ERP and Middleware applications using Playwright

# Node source — local execution node (where Playwright is installed)
resources.source.1.type=file
resources.source.1.config.file=/opt/playwright-monitor/rundeck/nodes.yaml
resources.source.1.config.generateFileAutomatically=true
resources.source.1.config.includeServerNode=true

# Default node
project.ssh-authentication=privateKey
project.ssh-keypath=/var/lib/rundeck/.ssh/id_rsa

# Execution settings
execution.disabled=false
schedule.disabled=false

# Log level
project.outputfilter.markdown.enabled=true
